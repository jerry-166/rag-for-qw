      - textbox [ref=e887]: BM25关键词检索的打分原理是什么？
    - generic [ref=e888]:
      - generic [ref=e889]: Answer
      - textbox [ref=e890]: "BM25（Best Matching 25）关键词检索的打分原理是基于词频（Term Frequency, TF）和逆文档频率（Inverse Document Frequency, IDF）来计算文档与查询之间的相关性分数。其核心公式为： \\[ \\text{score}(q, d) = \\sum_{t \\in q} IDF(t) \\cdot \\frac{f(t, d) \\cdot (k_1 + 1)}{f(t, d) + k_1 \\cdot (1 - b + b \\cdot \\frac{|d|}{\\text{avgdl}})}, \\] 其中： - \\( f(t, d) \\): 词 \\( t \\) 在文档 \\( d \\) 中的出现频率（词频）。 - \\( |d| \\): 文档 \\( d \\) 的长度。 - \\( \\text{avgdl} \\): 语料库中文档的平均长度。 - \\( k_1 \\) 和 \\( b \\): 调节参数，控制词频饱和度和文档长度归一化的程度。 - \\( IDF(t) \\): 逆文档频率，用于衡量词 \\( t \\) 的区分能力。 BM25 通过结合词频和逆文档频率，平衡了高频词的权重，同时避免过长文档对相关性分数的过度影响。 ### 来源 - [1] BM25排序函数的基本原理是什么？ - [2] BM25排序函数的核心原理是什么，它如何结合词频与逆文档频率进行打分？ - [4] BM25 是如何利用词频与逆文档频率进行排序的？"
    - generic [ref=e891]:
      - generic [ref=e892]: Contexts（每段用 --- 分隔）
      - textbox [ref=e893]: BM25 是基于词频与逆文档频率的经典排序函数，对查询词在文档中的频率与文档长度联合打分。它无需训练、可解释、能精确匹配术语，与向量检索互补。在第2部分中，我们关注BM25 关键词检索的工程落地细节。典型做法是先以默认配置建立基线，再用固定评测集对比迭代。监控指标包括 P95 延迟、吞吐量、错误率与质量评分，任何变更都应通过回归测试。与相邻组件的组合调优往往能带来叠加收益，例如召回阶段扩宽候选、精排阶段收紧阈值。运维上建议保留灰度开关，出现回退可快速切回；文档记录与告警配置同样重要。 --- BM25 是基于词频与逆文档频率的经典排序函数，对查询词在文档中的频率与文档长度联合打分。它无需训练、可解释、能精确匹配术语，与向量检索互补。在第4部分中，我们关注BM25 关键词检索的工程落地细节。典型做法是先以默认配置建立基线，再用固定评测集对比迭代。监控指标包括 P95 延迟、吞吐量、错误率与质量评分，任何变更都应通过回归测试。与相邻组件的组合调优往往能带来叠加收益，例如召回阶段扩宽候选、精排阶段收紧阈值。运维上建议保留灰度开关，出现回退可快速切回；文档记录与告警配置同样重要。 --- BM25 是基于词频与逆文档频率的经典排序函数，对查询词在文档中的频率与文档长度联合打分。它无需训练、可解释、能精确匹配术语，与向量检索互补。在第3部分中，我们关注BM25 关键词检索的工程落地细节。典型做法是先以默认配置建立基线，再用固定评测集对比迭代。监控指标包括 P95 延迟、吞吐量、错误率与质量评分，任何变更都应通过回归测试。与相邻组件的组合调优往往能带来叠加收益，例如召回阶段扩宽候选、精排阶段收紧阈值。运维上建议保留灰度开关，出现回退可快速切回；文档记录与告警配置同样重要。 --- BM25 是基于词频与逆文档频率的经典排序函数，对查询词在文档中的频率与文档长度联合打分。它无需训练、可解释、能精确匹配术语，与向量检索互补。在第1部分中，我们关注BM25 关键词检索的工程落地细节。典型做法是先以默认配置建立基线，再用固定评测集对比迭代。监控指标包括 P95 延迟、吞吐量、错误率与质量评分，任何变更都应通过回归测试。与相邻组件的组合调优往往能带来叠加收益，例如召回阶段扩宽候选、精排阶段收紧阈值。运维上建议保留灰度开关，出现回退可快速切回；文档记录与告警配置同样重要。
