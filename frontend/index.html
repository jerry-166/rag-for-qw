<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAGFlow - 智能知识库系统</title>
  <link rel="stylesheet" href="css/tokens.css?v=20260822c5" />
  <link rel="stylesheet" href="css/main.css?v=20260822c5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Markdown 渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PDF 渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 页面内容由 JS 动态渲染 -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <svg viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="var(--accent)" opacity=".28"/>
          <path d="M8 18 L13 10 L18 18 L23 10 L28 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="26" r="4" fill="var(--accent)"/>
        </svg>
        <span>RAGFlow</span>
      </div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- 模板：认证页 -->
  <template id="tpl-auth">
    <div class="auth-page">
      <div class="auth-bg-grid"></div>
      <div class="auth-card">
        <div class="auth-logo">
          <svg viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="10" fill="var(--accent)" opacity=".28"/>
            <path d="M8 18 L13 10 L18 18 L23 10 L28 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="26" r="4" fill="var(--accent)"/>
          </svg>
          <h1>RAGFlow</h1>
        </div>
        <p class="auth-subtitle">智能文档知识库系统</p>

        <!-- Tab 切换 -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="auth-form">
          <div class="form-field">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="输入用户名" required />
          </div>
          <div class="form-field">
            <label>密码</label>
            <div class="input-with-icon">
              <input type="password" id="login-password" placeholder="输入密码" required />
              <button type="button" class="toggle-pwd" data-target="login-password">👁</button>
            </div>
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-full">
            <span class="btn-text">登 录</span>
            <span class="btn-loading hidden">登录中...</span>
          </button>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="auth-form hidden">
          <div class="form-field">
            <label>用户名</label>
            <input type="text" id="reg-username" placeholder="输入用户名（3-20字符）" required />
          </div>
          <div class="form-field">
            <label>邮箱</label>
            <input type="email" id="reg-email" placeholder="输入邮箱地址" required />
          </div>
          <div class="form-field">
            <label>密码</label>
            <div class="input-with-icon">
              <input type="password" id="reg-password" placeholder="输入密码（6位以上）" required />
              <button type="button" class="toggle-pwd" data-target="reg-password">👁</button>
            </div>
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <div id="register-success" class="form-success hidden"></div>
          <button type="submit" class="btn btn-primary btn-full">
            <span class="btn-text">注 册</span>
            <span class="btn-loading hidden">注册中...</span>
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- 模板：主应用框架（圈 2：对齐线框 01 浮空玻璃壳） -->
  <template id="tpl-app">
    <div class="app-shell" id="app-shell">
      <!-- 浮空玻璃侧栏：sticky + 四周留边 + glass-2 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <span class="brand-mark">
              <svg viewBox="0 0 36 36" fill="none">
                <path d="M8 18 L13 10 L18 18 L23 10 L28 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="18" cy="26" r="4" fill="var(--accent)"/>
              </svg>
            </span>
            <span class="brand-name">RAGFlow</span>
          </div>
          <button class="sidebar-collapse" id="sidebar-toggle" title="折叠侧边栏" aria-label="折叠侧边栏">
            <svg viewBox="0 0 16 16" fill="none"><path d="M10 3 L5 8 L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-item" data-page="knowledge-bases" href="#" title="知识库">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.66 3.58-3 8-3s8 1.34 8 3-3.58 3-8 3-8-1.34-8-3z"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg></span>
            <span class="nav-label">知识库</span>
          </a>
          <a class="nav-item" data-page="documents" href="#" title="文档管理">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>
            <span class="nav-label">文档管理</span>
          </a>
          <a class="nav-item" data-page="search" href="#" title="知识检索">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
            <span class="nav-label">知识检索</span>
          </a>
          <a class="nav-item" data-page="agent" href="#" title="AI Agent">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span>
            <span class="nav-label">AI Agent</span>
          </a>
          <a class="nav-item" data-page="faq" href="#" title="知识记忆">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" stroke-dasharray="2.5 3.5"/></svg></span>
            <span class="nav-label">知识记忆</span>
          </a>
          <a class="nav-item" data-page="settings" href="#" title="设置">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
            <span class="nav-label">设置</span>
          </a>
          <a class="nav-item" data-page="audit" href="#" title="审计中心">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.01 6h0M3.01 12h0M3.01 18h0"/></svg></span>
            <span class="nav-label">审计中心</span>
          </a>
        </nav>

        <!-- 统计概览：2×2 数字带 -->
        <div class="sidebar-stats" id="sidebar-stats">
          <div class="sidebar-stats-header"><span class="stats-label">统计概览</span></div>
          <div class="sidebar-stats-content" id="sidebar-stats-content">
            <div class="stats-cell">
              <span class="stats-item-value" id="stats-documents">0</span>
              <span class="stats-item-label">文档</span>
            </div>
            <div class="stats-cell">
              <span class="stats-item-value" id="stats-chunks">0</span>
              <span class="stats-item-label">Chunk</span>
            </div>
            <div class="stats-cell">
              <span class="stats-item-value" id="stats-sub-questions">0</span>
              <span class="stats-item-label">子问题</span>
            </div>
            <div class="stats-cell">
              <span class="stats-item-value" id="stats-summaries">0</span>
              <span class="stats-item-label">摘要</span>
            </div>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="user-trigger" id="user-info-sidebar" type="button" role="button" aria-haspopup="menu" aria-expanded="false" aria-label="用户菜单" title="用户菜单">
            <div class="user-avatar" id="user-avatar">U</div>
            <div class="user-details">
              <span class="user-name" id="sidebar-username">用户</span>
              <span class="user-role" id="sidebar-role">普通用户</span>
            </div>
            <svg class="user-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content" id="main-content">
        <!-- 浮空胶囊 topbar：glass-3 + sticky -->
        <header class="topbar">
          <button class="topbar-menu-btn" id="mobile-menu-btn" title="打开菜单" aria-label="打开菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="topbar-breadcrumb" id="topbar-breadcrumb">知识库</div>
          <div class="topbar-spacer"></div>
          <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
            <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="topbar-avatar-btn" id="topbar-avatar-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="用户菜单" title="用户菜单">
            <span class="user-avatar-sm" id="topbar-avatar">U</span>
          </button>
        </header>

        <!-- 页面内容 -->
        <div class="page-container" id="page-container">
          <!-- 动态内容 -->
        </div>
      </main>
    </div>
  </template>

  <script src="js/api.js?v=20260822c5"></script>
  <script src="js/pages/knowledge-bases.js?v=20260822c5"></script>
  <script src="js/pages/documents.js?v=20260822c5"></script>
  <script src="js/pages/pipeline.js?v=20260822c5"></script>
  <script src="js/pages/search.js?v=20260822c5"></script>
  <script src="js/pages/agent.js?v=20260822c5"></script>
  <script src="js/pages/faq.js?v=20260822c5"></script>
  <script src="js/pages/settings.js?v=20260822c5"></script>
  <script src="js/pages/audit.js?v=20260822c5"></script>
  <script src="js/app.js?v=20260822c5"></script>
</body>
</html>
